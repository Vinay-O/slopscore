name: release
# Publish to npm with provenance (a signed, verifiable attestation linking the
# published tarball to this repo + commit). Triggered by pushing a v* tag.
# Requires an NPM_TOKEN (automation token) in repo secrets.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write   # required for npm provenance (OIDC)
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Install dev deps (for tests) and verify before publishing
        run: npm install --no-audit --no-fund
      - run: node --test
      - name: Self-scan gate
        run: node bin/slopscore.js scan . --fail-on minor
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
